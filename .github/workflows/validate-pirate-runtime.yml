name: Validate pirate runtime integration

on:
  push:
    branches: [art/pirate-runtime-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run engine tests
        run: npm test

      - name: Build Astro site
        run: npm run build:astro

      - name: Generate standalone fallback
        run: npm run standalone

      - name: Run structure audit
        run: npm run audit:structure

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run gameplay and pirate UI audit on one preview server
        shell: bash
        run: |
          set -euo pipefail
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/wordbound-preview.log 2>&1 &
          preview_pid=$!
          cleanup() { kill "$preview_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for attempt in $(seq 1 60); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/wordbound-battle/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then cat /tmp/wordbound-preview.log; exit 1; fi

          WORDBOUND_PREVIEW_URL=http://127.0.0.1:4321/wordbound-battle/ npm run test:e2e

          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          const url='http://127.0.0.1:4321/wordbound-battle/';
          for (const [name, launcher] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser=await launcher.launch({headless:true});
            try {
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              const errors=[];
              const bad=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('response',r=>{if(r.status()===404)bad.push(r.url())});
              const response=await page.goto(url,{waitUntil:'networkidle'});
              if (response?.status() !== 200) throw new Error(`${name}: preview HTTP ${response?.status()}`);
              await page.waitForFunction(() => document.querySelector('.tula-portrait')?.dataset.pirateArtReady === 'true');
              await page.waitForFunction(() => document.querySelector('.enemy-intro-avatar')?.dataset.pirateArtReady === 'true');
              const intro=await page.evaluate(() => ({
                tula: document.querySelector('.tula-portrait img.tula-pirate-sprite')?.naturalWidth || 0,
                enemy: document.querySelector('.enemy-intro-avatar img.enemy-pirate-sprite')?.naturalWidth || 0,
              }));
              if (!intro.tula || !intro.enemy) throw new Error(`${name}: pirate intro art missing`);
              await page.locator('[data-action="start"]').click();
              await page.waitForFunction(() => document.querySelector('.tula-mini')?.dataset.pirateArtReady === 'true');
              await page.waitForFunction(() => document.querySelector('.enemy-avatar-wrap')?.dataset.pirateArtReady === 'true');
              const battle=await page.evaluate(() => ({
                tula: document.querySelector('.tula-mini img.tula-pirate-sprite')?.naturalWidth || 0,
                enemy: document.querySelector('.enemy-avatar-wrap img.enemy-pirate-sprite')?.naturalWidth || 0,
                overflow: document.documentElement.scrollWidth > innerWidth + 1,
              }));
              if (!battle.tula || !battle.enemy) throw new Error(`${name}: pirate battle art missing`);
              if (battle.overflow) throw new Error(`${name}: pirate art caused horizontal overflow`);
              if (bad.length) throw new Error(`${name}: 404 responses: ${[...new Set(bad)].join(' | ')}`);
              if (errors.length) throw new Error(`${name}: browser errors: ${errors.join(' | ')}`);
              await page.screenshot({path:`audit-ci/pirate-${name}-390x844.png`,fullPage:false});
              await context.close();
            } finally {
              await browser.close();
            }
          }
          NODE

      - name: Verify all pirate AVIF assets decode in Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium, webkit } from 'playwright';
          const files = {
            tula: 'src/assets/pirate-data/tula.avif.b64.txt',
            coralox: 'src/assets/pirate-data/coralox.avif.b64.txt',
            nebulon: 'src/assets/pirate-data/nebulon.avif.b64.txt',
            sturmkrab: 'src/assets/pirate-data/sturmkrab.avif.b64.txt',
          };
          const sources = Object.fromEntries(Object.entries(files).map(([key,path]) => [key, `data:image/avif;base64,${fs.readFileSync(path,'utf8').trim()}`]));
          for (const [name, launcher] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser = await launcher.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const result = await page.evaluate(async (sources) => {
                const out = {};
                for (const [key, src] of Object.entries(sources)) {
                  out[key] = await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve({ ok: true, width: img.naturalWidth, height: img.naturalHeight });
                    img.onerror = () => resolve({ ok: false, width: 0, height: 0 });
                    img.src = src;
                  });
                }
                return out;
              }, sources);
              console.log(name, result);
              for (const [key, value] of Object.entries(result)) {
                if (!value.ok || value.width < 32 || value.height < 32) throw new Error(`${name}: ${key} failed to decode`);
              }
            } finally {
              await browser.close();
            }
          }
          NODE

      - name: Smoke-test standalone pirate art
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 > /tmp/standalone.log 2>&1 &
          standalone_pid=$!
          cleanup() { kill "$standalone_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/prototype.html || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then cat /tmp/standalone.log; exit 1; fi
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            const bad=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('response',r=>{if(r.status()===404)bad.push(r.url())});
            const response=await page.goto('http://127.0.0.1:8765/prototype.html',{waitUntil:'networkidle'});
            if (response?.status() !== 200) throw new Error(`Standalone HTTP ${response?.status()}`);
            await page.waitForFunction(() => document.querySelector('.tula-portrait')?.dataset.pirateArtReady === 'true');
            await page.waitForFunction(() => document.querySelector('.enemy-intro-avatar')?.dataset.pirateArtReady === 'true');
            const art=await page.evaluate(() => ({
              tula: document.querySelector('.tula-portrait img.tula-pirate-sprite')?.naturalWidth || 0,
              enemy: document.querySelector('.enemy-intro-avatar img.enemy-pirate-sprite')?.naturalWidth || 0,
              overflow: document.documentElement.scrollWidth > innerWidth + 1,
            }));
            if (!art.tula || !art.enemy) throw new Error('Standalone pirate art missing');
            if (art.overflow) throw new Error('Standalone horizontal overflow');
            if (bad.length) throw new Error(`Standalone 404s: ${[...new Set(bad)].join(' | ')}`);
            if (errors.length) throw new Error(`Standalone errors: ${errors.join(' | ')}`);
            await context.close();
          } finally { await browser.close(); }
          NODE

      - name: Upload pirate art screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordbound-pirate-runtime-audit
          path: audit-ci/*.png
          if-no-files-found: warn
