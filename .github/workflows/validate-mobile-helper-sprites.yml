name: Validate mobile helper sprites

on:
  push:
    branches: [mobile-helper-sprites-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run engine tests
        run: npm test

      - name: Build Astro site
        run: npm run build:astro

      - name: Generate standalone fallback
        run: npm run standalone

      - name: Run structure audit
        run: npm run audit:structure

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run mobile/desktop gameplay browser audit
        shell: bash
        run: |
          set -euo pipefail
          npx astro preview --host 127.0.0.1 --port 4321 > /tmp/wordbound-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid || true' EXIT
          ok=0
          for attempt in $(seq 1 60); do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4321/wordbound-battle/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then cat /tmp/wordbound-preview.log; exit 1; fi
          WORDBOUND_PREVIEW_URL=http://127.0.0.1:4321/wordbound-battle/ npm run test:e2e

      - name: Verify helper sprite assets are emitted
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist-astro -type f -iname '*.webp' | wc -l)
          echo "WebP assets emitted: $count"
          test "$count" -ge 4

      - name: Smoke-test standalone fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 > /tmp/standalone.log 2>&1 &
          standalone_pid=$!
          trap 'kill $standalone_pid || true' EXIT
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/prototype.html || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const page = await context.newPage();
            const errors = [];
            const bad = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            page.on('response', r => { if (r.status() === 404) bad.push(r.url()); });
            const response = await page.goto('http://127.0.0.1:8765/prototype.html', { waitUntil: 'networkidle' });
            if (response?.status() !== 200) throw new Error(`Standalone HTTP ${response?.status()}`);
            await page.locator('[data-action="start"]').click();
            if (await page.locator('[data-helper]').count() !== 4) throw new Error('Standalone helper count mismatch');
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 1);
            if (overflow) throw new Error('Standalone horizontal overflow on 390px viewport');
            if (errors.length) throw new Error(`Standalone errors: ${errors.join(' | ')}`);
            if (bad.length) throw new Error(`Standalone 404s: ${bad.join(' | ')}`);
            await context.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordbound-mobile-helper-audit
          path: audit-ci/*.png
          if-no-files-found: warn
